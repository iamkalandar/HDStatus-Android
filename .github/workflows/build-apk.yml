name: Build HD Status APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest HD Status project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(find . -maxdepth 1 -type f -name 'HDStatusGalleryFirstUI.zip' -print -quit)"
          if [ -z "$ZIP_PATH" ]; then
            echo "HDStatusGalleryFirstUI.zip was not found in the repository root."
            echo "Upload the ZIP to the repository root first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/hdstatus-project"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/hdstatus-project"
          if [ ! -d "$RUNNER_TEMP/hdstatus-project/HDStatusFresh" ]; then
            echo "Expected HDStatusFresh folder was not found inside the ZIP."
            exit 1
          fi
          cp -a "$RUNNER_TEMP/hdstatus-project/HDStatusFresh/." .
          echo "Project source extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the runner Android SDK."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-Status-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
