
name: Build HD Status APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ARCHIVE="$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            echo "Upload the HD Status project ZIP to the repository root."
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          mkdir -p extracted
          unzip -oq "$ARCHIVE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: ZIP does not contain settings.gradle.kts."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file was not found in $PROJECT_DIR."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          cp "$APK" app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-Status-debug-apk
          path: app-debug.apk
          if-no-files-found: error
