name: Build HD Status APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project archive
        run: |
          unzip -q HDStatusFreshProject.zip
          test -f HDStatusFresh/settings.gradle.kts
          test -f HDStatusFresh/app/build.gradle.kts

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4

      - name: Run Gradle build
        run: gradle -p HDStatusFresh assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-Status-debug-apk
          path: HDStatusFresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
