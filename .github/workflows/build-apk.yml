
      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "kotlinOptions" not in s:
              marker = "    defaultConfig {"
              config = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          """
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              s = s.replace(marker, config + marker, 1)

          p.write_text(s)
          print("Java and Kotlin targets set to JVM 17")
          PY
