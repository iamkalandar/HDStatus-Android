
name: Build HD Status APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fresh HD Status project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="HDStatusFreshApp_v1.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "Project ZIP not found: $ZIP_PATH"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/hdstatus-project"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/hdstatus-project"

          PROJECT="$RUNNER_TEMP/hdstatus-project/HDStatusFresh"

          if [ ! -d "$PROJECT" ]; then
            echo "HDStatusFresh folder missing from ZIP"
            exit 1
          fi

          cp -a "$PROJECT/." .
          echo "Project extracted successfully."

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              marker = "    defaultConfig {"
              config = """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              """
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              s = s.replace(marker, config + marker, 1)

          if "kotlinOptions" not in s:
              marker = "    defaultConfig {"
              config = """    kotlinOptions {
                  jvmTarget = "17"
              }

              """
              if marker not in s:
                  raise SystemExit("Could not find defaultConfig in app/build.gradle.kts")
              s = s.replace(marker, config + marker, 1)

          p.write_text(s)
          print("Java and Kotlin JVM targets set to 17")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HD-Status-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
